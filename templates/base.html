<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Greenhouse System{% endblock %}</title>

    <!-- Global CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- NAVIGATION BAR -->
    <nav class="navbar">
        <div class="nav-left">
            🌱 Greenhouse System
        </div>

        <div class="nav-right">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('next_month_prediction') }}">Prediction</a>
            <a href="{{ url_for('users') }}">Users</a>
            <a href="{{ url_for('logout') }}" onclick="return confirm('Logout?')">Logout</a>
        </div>
    </nav>

    <!-- PAGE CONTENT -->
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

</body>
</html>
