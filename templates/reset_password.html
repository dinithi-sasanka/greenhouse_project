<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password | Greenhouse System</title>

    <!-- Global CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .reset-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #2e7d32, #66bb6a);
        }

        .reset-card {
            background: white;
            padding: 30px;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .reset-card h2 {
            text-align: center;
            color: #2e7d32;
            margin-bottom: 15px;
        }

        .reset-card p {
            text-align: center;
            color: #555;
            margin-bottom: 20px;
        }

        .reset-card small {
            color: #777;
        }

        .reset-card a {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #2e7d32;
            font-weight: 500;
        }

        .reset-card a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="reset-wrapper">
    <div class="reset-card">

        <h2>🔒 Reset Password</h2>
        <p>User: <strong>{{ username }}</strong></p>

        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, msg in messages %}
              <div class="alert {{ category }}">{{ msg }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">

            <label>New Password</label>
            <input type="password"
                   name="new_password"
                   minlength="6"
                   placeholder="Enter new password"
                   required>
            <small>Minimum 6 characters</small>

            <br><br>

            <label>Confirm Password</label>
            <input type="password"
                   name="confirm_password"
                   minlength="6"
                   placeholder="Re-enter new password"
                   required>

            <button type="submit">Reset Password</button>
        </form>

        <a href="{{ url_for('login') }}">← Back to Login</a>

    </div>
</div>

</body>
</html>
