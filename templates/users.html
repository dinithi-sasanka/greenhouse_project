<!DOCTYPE html>
<html>
<head>
    <title>Users Management</title>
    <style>
        .password-container {
            position: relative;
            display: inline-block;
        }
        .toggle-password {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
        }
        input[type="password"][readonly] {
            background-color: #f2f2f2;
            border: 1px solid #ccc;
        }
        input:invalid {
            border-color: red;
        }
        input:valid {
            border-color: green;
        }
    </style>
</head>
<body>

<h2>Add New User</h2>
<form method="POST">
    Username: <input name="username" required pattern=".{3,}" title="Minimum 3 characters"><br><br>

    Password: 
    <div class="password-container">
        <input type="password" id="add_password" name="password" required pattern=".{6,}" title="Minimum 6 characters">
        <span class="toggle-password" onclick="toggleAddPassword()">👁️</span>
    </div>
    <br><br>

    Role: 
    <select name="role">
        <option value="user">User</option>
        <option value="admin">Admin</option>
    </select><br><br>

    Email: <input name="email" type="email" placeholder="example@email.com" required><br><br>
    Address: <input name="address" required><br><br>
    Telephone: <input name="telephone" type="tel" pattern="[0-9]{10}" placeholder="10-digit number" required><br><br>

    <button type="submit">Add User</button>
</form>

<hr>

<h2>All Users</h2>

<form method="GET">
    <input type="text" name="search" placeholder="Search username/email" value="{{ request.args.get('search') }}">
    <button type="submit">Search</button>
    <button type="button" onclick="window.location.href='/users'">Clear</button>
</form>
<br>

<table border="1" cellpadding="6">
<tr>
    <th>ID</th>
    <th>Username</th>
    <th>Password</th>
    <th>Role</th>
    <th>Email</th>
    <th>Address</th>
    <th>Telephone</th>
    <th>Actions</th>
</tr>

{% for u in users %}
<tr>
<form method="POST" action="/edit_user/{{ u.id }}">
    <td>{{ u.id }}</td>
    <td><input name="username" value="{{ u.username }}" required pattern=".{3,}" title="Minimum 3 characters"></td>
    
    <td>
        <div class="password-container">
            <input type="password" class="user-password" value="{{ u.password }}" readonly>
            <span class="toggle-password" onclick="togglePassword(this)">👁️</span>
        </div>
    </td>

    <td>
        <select name="role">
            <option value="user" {% if u.role=='user' %}selected{% endif %}>User</option>
            <option value="admin" {% if u.role=='admin' %}selected{% endif %}>Admin</option>
        </select>
    </td>

    <td><input name="email" type="email" value="{{ u.email }}" required></td>
    <td><input name="address" value="{{ u.address }}" required></td>
    <td><input name="telephone" type="tel" value="{{ u.telephone }}" pattern="[0-9]{10}" required></td>

    <td>
        <button type="submit">Update</button>
        <a href="/delete_user/{{ u.id }}" onclick="return confirm('Delete user?')">Delete</a>
    </td>
</form>
</tr>
{% endfor %}
</table>

<script>
function toggleAddPassword() {
    var pwd = document.getElementById('add_password');
    pwd.type = (pwd.type === 'password') ? 'text' : 'password';
}

function togglePassword(span) {
    var pwd = span.previousElementSibling;
    pwd.type = (pwd.type === 'password') ? 'text' : 'password';
}
</script>

</body>
</html>
